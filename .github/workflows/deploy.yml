name: deploy to cloudflare workers

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".agent/**"
      - ".agents/**"
      - ".vscode/**"
      - ".gitignore"
  workflow_dispatch:

jobs:
  test:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun ci
      - run: cp wrangler.example.jsonc wrangler.jsonc
      - run: bun lint
      - run: bun run i18n:compile
      - run: bun typecheck
      - run: bun run test:node
      - run: bun run test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: ${{ secrets.WORKER_NAME || 'my-blog' }}
      QUEUE_NAME: ${{ secrets.QUEUE_NAME || 'blog-queue' }}
      DOMAIN: ${{ secrets.DOMAIN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
      VITE_ICP_NUMBER: ${{ vars.VITE_ICP_NUMBER }}
      VITE_ICP_URL: ${{ vars.VITE_ICP_URL }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
      VITE_BLOG_TITLE: ${{ vars.VITE_BLOG_TITLE }}
      VITE_BLOG_AUTHOR: ${{ vars.VITE_BLOG_AUTHOR }}
      VITE_BLOG_DESCRIPTION: ${{ vars.VITE_BLOG_DESCRIPTION }}
      VITE_BLOG_GITHUB: ${{ vars.VITE_BLOG_GITHUB }}
      VITE_BLOG_EMAIL: ${{ vars.VITE_BLOG_EMAIL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
      GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
      UMAMI_SRC: ${{ secrets.UMAMI_SRC }}
      UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
      UMAMI_USERNAME: ${{ secrets.UMAMI_USERNAME }}
      UMAMI_PASSWORD: ${{ secrets.UMAMI_PASSWORD }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun ci
      - name: Prepare Cloudflare configuration
        run: bun run wrangler:prepare
      - name: Set runtime secrets
        run: |
          node -e 'const keys = ["BETTER_AUTH_SECRET", "BETTER_AUTH_URL", "GITHUB_CLIENT_ID", "GITHUB_CLIENT_SECRET", "DOMAIN", "GITHUB_TOKEN", "UMAMI_WEBSITE_ID", "UMAMI_SRC", "UMAMI_API_KEY", "UMAMI_USERNAME", "UMAMI_PASSWORD", "TURNSTILE_SECRET_KEY"]; const values = Object.fromEntries(keys.map((key) => [key, process.env[key]]).filter(([, value]) => value)); process.stdout.write(JSON.stringify(values));' > secrets.json
          bunx wrangler secret bulk secrets.json
      - name: Build and deploy
        run: bun run build && bun run deploy
